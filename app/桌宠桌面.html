<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>阿真桌面宠物</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }

    body {
      -webkit-app-region: drag;
    }

    .azhen-pet {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background: transparent;
    }

    .azhen-pet-video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: transparent;
      filter: drop-shadow(0 16px 28px rgba(15, 23, 42, 0.18));
      pointer-events: none;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(23, 32, 51, 0.72);
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: rgba(255, 255, 255, 0.01);
    }
  </style>
</head>
<body>
  <div id="petRoot"><div class="loading">loading</div></div>

  <script src="./桌宠运行时.js"></script>
  <script>
    const fallbackManifest = {
      defaultState: "working",
      states: {
        working: { label: "任务进行中", file: "../05_透明素材/任务进行中.webm", loop: true, eventAliases: ["agent.task.running", "agent.task.started", "agent.task.progress", "codex.task.running", "codex.turn.running", "claude.task.running", "claude_code.task.running", "claudecode.task.running"] },
        done: { label: "任务完成", file: "../05_透明素材/任务完成.webm", loop: false, holdMs: 4200, autoReturnTo: "paused", eventAliases: ["agent.task.done", "agent.task.completed", "agent.output.ready", "codex.task.completed", "codex.turn.completed", "codex.output.ready", "claude.task.completed", "claude.output.ready", "claude_code.task.completed", "claudecode.task.completed"] },
        failed: { label: "任务失败", file: "../05_透明素材/任务失败.webm", loop: false, holdMs: 4200, autoReturnTo: "paused", eventAliases: ["agent.task.failed", "agent.task.error", "agent.tool.error", "codex.task.failed", "codex.tool.error", "claude.task.failed", "claude.tool.error", "claude_code.task.failed", "claudecode.task.failed"] },
        paused: { label: "任务暂停", file: "../05_透明素材/任务暂停.webm", loop: true, eventAliases: ["agent.waiting.user", "agent.waiting.approval", "agent.task.paused", "agent.idle", "codex.waiting.user", "codex.waiting.approval", "codex.goal.blocked", "claude.waiting.user", "claude.waiting.approval", "claude.needs_input", "claude_code.waiting.user", "claudecode.waiting.user"] },
        water: { label: "喝水提醒", file: "../05_透明素材/喝水提醒.webm", loop: false, holdMs: 4200, autoReturnTo: "working", eventAliases: ["reminder.water.hourly"] }
      },
      reminders: {
        water: { enabled: true, intervalMinutes: 60, state: "water", workHours: { start: "09:00", end: "18:00" } }
      }
    };

    async function loadManifest() {
      if (window.desktopPet && window.desktopPet.getManifest) {
        return await window.desktopPet.getManifest();
      }
      try {
        const response = await fetch("../06_桌宠模板/状态映射.json");
        if (!response.ok) throw new Error("manifest");
        return await response.json();
      } catch (_) {
        return fallbackManifest;
      }
    }

    function parseClock(value) {
      const match = /^(\d{2}):(\d{2})$/.exec(String(value || ""));
      if (!match) return null;
      return Number(match[1]) * 60 + Number(match[2]);
    }

    function isWithinClockRange(startText, endText, now) {
      const start = parseClock(startText);
      const end = parseClock(endText);
      if (start === null || end === null) return true;
      const current = now.getHours() * 60 + now.getMinutes();
      if (start <= end) return current >= start && current <= end;
      return current >= start || current <= end;
    }

    function applySettingsToManifest(manifest, settings) {
      const hold = (settings && settings.stateHoldMs) || {};
      if (manifest.states.done) manifest.states.done.holdMs = Number(hold.done || manifest.states.done.holdMs || 4200);
      if (manifest.states.failed) manifest.states.failed.holdMs = Number(hold.failed || manifest.states.failed.holdMs || 4200);
      if (manifest.states.water) {
        manifest.states.water.holdMs = Number(hold.water || manifest.states.water.holdMs || 120000);
        manifest.states.water.loop = true;
        manifest.states.water.autoReturnTo = manifest.states.water.autoReturnTo || "working";
      }
    }

    let schedulerStops = [];
    let restActive = false;

    function stopSchedulers() {
      schedulerStops.forEach((stop) => stop());
      schedulerStops = [];
      restActive = false;
    }

    function startSchedulers(pet, settings) {
      stopSchedulers();
      const water = (settings && settings.waterReminder) || {};
      const rest = (settings && settings.rest) || {};

      function isRestTime() {
        return Boolean(rest.enabled) && isWithinClockRange(rest.start, rest.end, new Date());
      }

      function checkRest() {
        const state = rest.state || "paused";
        if (isRestTime()) {
          if (!restActive) {
            restActive = true;
            pet.setState(state);
          }
          return;
        }
        if (restActive) {
          restActive = false;
          if (pet.getState() === state) pet.setState("working");
        }
      }

      if (rest.enabled) {
        checkRest();
        const restTimer = window.setInterval(checkRest, 30 * 1000);
        schedulerStops.push(() => window.clearInterval(restTimer));
      }

      if (water.enabled) {
        const minutes = Math.max(5, Number(water.intervalMinutes || 60));
        const waterTimer = window.setInterval(() => {
          if (isRestTime()) return;
          if (!isWithinClockRange(water.workStart, water.workEnd, new Date())) return;
          pet.setState("water");
        }, minutes * 60 * 1000);
        schedulerStops.push(() => window.clearInterval(waterTimer));
      }
    }

    function dispatchPetEvent(pet, event) {
      const payload = event && typeof event === "object" ? event : { name: event };
      const name = payload.name || payload.event || "";
      if (!name) return false;
      return pet.dispatchEvent(name, {
        manual: Boolean(payload.manual),
        source: payload.source || (payload.manual ? "manual" : "event")
      });
    }

    Promise.all([
      loadManifest(),
      window.desktopPet && window.desktopPet.getSettings ? window.desktopPet.getSettings() : Promise.resolve({})
    ]).then(([manifest, settings]) => {
      const root = document.getElementById("petRoot");
      root.innerHTML = "";
      applySettingsToManifest(manifest, settings);
      const pet = window.createAzhenPet(root, manifest, {
        state: manifest.defaultState || "working",
        draggable: false
      });
      root.addEventListener("azhenpet:statechange", (event) => {
        if (window.desktopPet && window.desktopPet.notifyState) {
          window.desktopPet.notifyState(event.detail);
        }
      });
      window.AzhenPet = pet;
      if (window.desktopPet) {
        window.desktopPet.onEvent((event) => dispatchPetEvent(pet, event));
        window.desktopPet.onSettings((nextSettings) => {
          applySettingsToManifest(manifest, nextSettings);
          startSchedulers(pet, nextSettings);
        });
      }
      window.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        if (window.desktopPet && window.desktopPet.showContextMenu) {
          window.desktopPet.showContextMenu();
        }
      });
      startSchedulers(pet, settings);
    });
  </script>
</body>
</html>
