<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>阿真桌宠设置</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d8dee8;
      --blue: #1769e0;
      --green: #148a4b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    main {
      display: grid;
      gap: 16px;
      padding: 22px;
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: 18px;
      line-height: 1.2;
    }

    h2 {
      font-size: 14px;
      line-height: 1.3;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
    }

    .panel {
      display: grid;
      gap: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .row,
    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .field-row {
      align-items: flex-start;
    }

    label {
      font-size: 13px;
      font-weight: 700;
    }

    output,
    .filename {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    output {
      min-width: 72px;
      text-align: right;
    }

    .filename {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
    }

    input[type="number"],
    input[type="time"] {
      width: 104px;
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--blue);
    }

    .preset-grid,
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .action-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .asset-list {
      display: grid;
      gap: 8px;
    }

    .asset-row {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr) 78px;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .field-grid {
      display: grid;
      gap: 10px;
    }

    .two-cols {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .unit-input {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .unit {
      min-width: 24px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    button {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--blue);
    }

    button[data-active="true"] {
      border-color: var(--blue);
      color: var(--blue);
      box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.12);
    }

    .status {
      min-height: 16px;
      color: var(--green);
      font-size: 12px;
    }

    .save-status {
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>阿真桌宠设置</h1>
      <div class="muted">状态、素材、提醒</div>
      <div class="status save-status" id="saveStatus">已自动保存</div>
    </div>

    <section class="panel">
      <div class="row">
        <h2>显示大小</h2>
        <output id="sizeValue">420px</output>
      </div>
      <input id="sizeRange" type="range" min="180" max="760" step="10" value="420">
      <div class="preset-grid">
        <button type="button" data-size="300">小</button>
        <button type="button" data-size="420">中</button>
        <button type="button" data-size="560">大</button>
        <button type="button" data-size="680">超大</button>
      </div>
    </section>

    <section class="panel">
      <div class="row">
        <h2>标准素材</h2>
        <button type="button" id="openAssets">打开文件夹</button>
      </div>
      <div class="asset-list" id="assetList"></div>
      <div class="status" id="assetStatus"></div>
    </section>

    <section class="panel">
      <h2>动作停留</h2>
      <div class="field-grid">
        <div class="field">
          <label for="doneSeconds">完成</label>
          <div class="unit-input">
            <input id="doneSeconds" type="number" min="1" max="60" step="0.5">
            <span class="unit">s</span>
          </div>
        </div>
        <div class="field">
          <label for="failedSeconds">失败</label>
          <div class="unit-input">
            <input id="failedSeconds" type="number" min="1" max="60" step="0.5">
            <span class="unit">s</span>
          </div>
        </div>
        <div class="field">
          <label for="waterMinutes">喝水</label>
          <div class="unit-input">
            <input id="waterMinutes" type="number" min="0.5" max="10" step="0.5">
            <span class="unit">min</span>
          </div>
        </div>
      </div>
      <button type="button" id="previewWater">预览喝水</button>
    </section>

    <section class="panel">
      <div class="row">
        <h2>喝水提醒</h2>
        <input id="waterEnabled" type="checkbox">
      </div>
      <div class="field-grid">
        <div class="field">
          <label for="waterInterval">间隔分钟</label>
          <input id="waterInterval" type="number" min="5" max="240" step="5">
        </div>
        <div class="two-cols">
          <div class="field">
            <label for="workStart">开始</label>
            <input id="workStart" type="time">
          </div>
          <div class="field">
            <label for="workEnd">结束</label>
            <input id="workEnd" type="time">
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="row">
        <h2>休息时间</h2>
        <input id="restEnabled" type="checkbox">
      </div>
      <div class="two-cols">
        <div class="field">
          <label for="restStart">开始</label>
          <input id="restStart" type="time">
        </div>
        <div class="field">
          <label for="restEnd">结束</label>
          <input id="restEnd" type="time">
        </div>
      </div>
      <button type="button" id="previewRest">预览休息</button>
    </section>

    <section class="panel">
      <h2>位置</h2>
      <div class="action-grid">
        <button type="button" id="resetPosition">回到右下角</button>
        <button type="button" id="previewWorking">回到工作</button>
      </div>
    </section>
  </main>

  <script>
    const assetLabels = {
      working: "进行中",
      done: "完成",
      failed: "失败",
      paused: "暂停/休息",
      water: "喝水"
    };
    const eventByState = {
      working: "agent.task.running",
      done: "agent.task.done",
      failed: "agent.task.failed",
      paused: "agent.waiting.user",
      water: "reminder.water.hourly"
    };

    const sizeRange = document.getElementById("sizeRange");
    const sizeValue = document.getElementById("sizeValue");
    const presetButtons = Array.from(document.querySelectorAll("[data-size]"));
    const assetList = document.getElementById("assetList");
    const assetStatus = document.getElementById("assetStatus");
    const saveStatus = document.getElementById("saveStatus");

    const doneSeconds = document.getElementById("doneSeconds");
    const failedSeconds = document.getElementById("failedSeconds");
    const waterMinutes = document.getElementById("waterMinutes");
    const waterEnabled = document.getElementById("waterEnabled");
    const waterInterval = document.getElementById("waterInterval");
    const workStart = document.getElementById("workStart");
    const workEnd = document.getElementById("workEnd");
    const restEnabled = document.getElementById("restEnabled");
    const restStart = document.getElementById("restStart");
    const restEnd = document.getElementById("restEnd");
    let saveStatusTimer = null;
    let timingSaveTimer = null;
    let sizeSaveTimer = null;

    function showSaving() {
      saveStatus.textContent = "保存中...";
    }

    function showSaved(text = "已自动保存") {
      if (saveStatusTimer) window.clearTimeout(saveStatusTimer);
      saveStatus.textContent = text;
      saveStatusTimer = window.setTimeout(() => {
        saveStatus.textContent = "已自动保存";
      }, 1800);
    }

    function renderSettings(settings) {
      const size = Number(settings.sizePx || 420);
      const hold = settings.stateHoldMs || {};
      const water = settings.waterReminder || {};
      const rest = settings.rest || {};

      sizeRange.value = String(size);
      sizeValue.textContent = `${size}px`;
      presetButtons.forEach((button) => {
        button.dataset.active = String(Number(button.dataset.size) === size);
      });

      doneSeconds.value = String(Math.round(Number(hold.done || 4200) / 100) / 10);
      failedSeconds.value = String(Math.round(Number(hold.failed || 4200) / 100) / 10);
      waterMinutes.value = String(Math.round((Number(hold.water || 120000) / 60000) * 10) / 10);
      waterEnabled.checked = Boolean(water.enabled);
      waterInterval.value = String(water.intervalMinutes || 60);
      workStart.value = water.workStart || "09:00";
      workEnd.value = water.workEnd || "18:00";
      restEnabled.checked = Boolean(rest.enabled);
      restStart.value = rest.start || "12:00";
      restEnd.value = rest.end || "13:00";
    }

    function renderAssets(assets) {
      assetList.innerHTML = "";
      assets.forEach((asset) => {
        const row = document.createElement("div");
        row.className = "asset-row";

        const label = document.createElement("label");
        label.textContent = assetLabels[asset.stateKey] || asset.label;

        const filename = document.createElement("div");
        filename.className = "filename";
        filename.textContent = asset.filename || "未选择";
        filename.title = asset.path || "";

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "替换";
        button.addEventListener("click", async () => {
          showSaving();
          const result = await window.desktopPet.replaceAsset(asset.stateKey);
          if (!result || result.canceled) {
            showSaved();
            return;
          }
          if (!result.ok) {
            assetStatus.textContent = "替换失败";
            saveStatus.textContent = "替换失败";
            return;
          }
          assetStatus.textContent = `已替换：${result.label}`;
          renderAssets(result.assets);
          showSaved("已替换并自动保存");
          window.desktopPet.sendEvent(eventByState[asset.stateKey] || "agent.task.running", { manual: true });
        });

        row.append(label, filename, button);
        assetList.appendChild(row);
      });
    }

    async function setSize(size) {
      showSaving();
      const settings = await window.desktopPet.updateSettings({ sizePx: Number(size) });
      renderSettings(settings);
      showSaved();
    }

    function updateTiming() {
      showSaving();
      window.desktopPet.updateSettings({
        stateHoldMs: {
          done: Number(doneSeconds.value || 4.2) * 1000,
          failed: Number(failedSeconds.value || 4.2) * 1000,
          water: Number(waterMinutes.value || 2) * 60 * 1000
        },
        waterReminder: {
          enabled: waterEnabled.checked,
          intervalMinutes: Number(waterInterval.value || 60),
          workStart: workStart.value,
          workEnd: workEnd.value
        },
        rest: {
          enabled: restEnabled.checked,
          start: restStart.value,
          end: restEnd.value,
          state: "paused"
        }
      }).then((settings) => {
        renderSettings(settings);
        showSaved();
      });
    }

    function queueTimingSave() {
      showSaving();
      if (timingSaveTimer) window.clearTimeout(timingSaveTimer);
      timingSaveTimer = window.setTimeout(updateTiming, 450);
    }

    function queueSizeSave() {
      if (sizeSaveTimer) window.clearTimeout(sizeSaveTimer);
      sizeSaveTimer = window.setTimeout(() => setSize(sizeRange.value), 300);
    }

    window.desktopPet.getSettings().then(renderSettings);
    window.desktopPet.getAssets().then(renderAssets);
    window.desktopPet.onSettings(renderSettings);

    sizeRange.addEventListener("input", () => {
      sizeValue.textContent = `${sizeRange.value}px`;
      queueSizeSave();
    });
    sizeRange.addEventListener("change", () => setSize(sizeRange.value));

    presetButtons.forEach((button) => {
      button.addEventListener("click", () => setSize(button.dataset.size));
    });

    [
      doneSeconds,
      failedSeconds,
      waterMinutes,
      waterEnabled,
      waterInterval,
      workStart,
      workEnd,
      restEnabled,
      restStart,
      restEnd
    ].forEach((input) => {
      input.addEventListener("input", queueTimingSave);
      input.addEventListener("change", updateTiming);
    });

    document.getElementById("openAssets").addEventListener("click", () => {
      window.desktopPet.openAssetsFolder();
    });
    document.getElementById("resetPosition").addEventListener("click", () => {
      window.desktopPet.resetPosition().then(renderSettings);
    });
    document.getElementById("previewWater").addEventListener("click", () => {
      window.desktopPet.sendEvent("reminder.water.hourly", { manual: true });
    });
    document.getElementById("previewRest").addEventListener("click", () => {
      window.desktopPet.sendEvent("agent.waiting.user", { manual: true });
    });
    document.getElementById("previewWorking").addEventListener("click", () => {
      window.desktopPet.sendEvent("agent.task.running", { manual: true });
    });
  </script>
</body>
</html>
