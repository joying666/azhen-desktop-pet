name: Build Desktop Pet

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1

      - name: Syntax check
        run: npm run check

      - name: Runtime state loop tests
        run: npm run test:runtime

      - name: Build Windows artifacts
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm run dist:win
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1

      - name: Smoke test Windows EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "No Windows EXE was built."
          }

          function Get-PetHealth {
            return Invoke-RestMethod -Uri "http://127.0.0.1:17876/health" -TimeoutSec 2
          }

          function Wait-PetHealth {
            param(
              [scriptblock]$Predicate,
              [string]$Description,
              [int]$Attempts = 60,
              [int]$DelayMs = 1000
            )

            $lastHealth = $null
            for ($i = 1; $i -le $Attempts; $i++) {
              Start-Sleep -Milliseconds $DelayMs
              try {
                $lastHealth = Get-PetHealth
                if (& $Predicate $lastHealth) {
                  $lastHealth | ConvertTo-Json -Depth 6
                  return $lastHealth
                }
              } catch {
                Write-Host "Waiting for desktop pet health endpoint..."
              }
            }

            if ($lastHealth) {
              $lastHealth | ConvertTo-Json -Depth 6
            }
            throw "Timed out waiting for $Description."
          }

          Write-Host "Starting $($exe.FullName)"
          $process = Start-Process -FilePath $exe.FullName -PassThru
          $ok = $false

          try {
            Wait-PetHealth -Description "main health endpoint" -Predicate {
              param($health)
              $health.ok -eq $true -and
                $health.app -eq "azhen-desktop-pet" -and
                $null -ne $health.settings.hideOnFullScreen
            } | Out-Null

            $assets = Invoke-RestMethod -Uri "http://127.0.0.1:17876/assets" -TimeoutSec 2
            if ($assets.ok -ne $true -or
                $assets.supportedExtensions -notcontains ".gif" -or
                $assets.supportedExtensions -notcontains ".webp" -or
                $assets.supportedExtensions -notcontains ".webm") {
              throw "Packaged EXE did not expose the expected replaceable asset formats."
            }

            $settingsOn = Invoke-RestMethod -Uri "http://127.0.0.1:17876/settings?hideOnFullScreen=1" -TimeoutSec 2
            if ($settingsOn.settings.hideOnFullScreen -ne $true) {
              throw "Packaged EXE did not enable hideOnFullScreen."
            }

            $settingsOff = Invoke-RestMethod -Uri "http://127.0.0.1:17876/settings?hideOnFullScreen=0" -TimeoutSec 2
            if ($settingsOff.settings.hideOnFullScreen -ne $false) {
              throw "Packaged EXE did not disable hideOnFullScreen."
            }

            $ok = $true
          } finally {
            Get-Process -Name "Azhen Desktop Pet" -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

          if (-not $ok) {
            Get-CimInstance Win32_Process |
              Where-Object { $_.Name -like "*Azhen*" -or $_.ExecutablePath -like "*Azhen Desktop Pet*" } |
              Select-Object ProcessId, Name, ExecutablePath, CommandLine |
              Format-List
            throw "Windows EXE did not start or did not expose a healthy desktop-pet endpoint."
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azhen-desktop-pet-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
