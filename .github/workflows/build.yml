name: Build Desktop Pet

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1

      - name: Syntax check
        run: npm run check

      - name: Build Windows artifacts
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm run dist:win
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azhen-desktop-pet-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
