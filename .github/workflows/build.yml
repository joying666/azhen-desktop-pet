name: Build Desktop Pet

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1

      - name: Syntax check
        run: npm run check

      - name: Build Windows artifacts
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm run dist:win
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1

      - name: Smoke test Windows EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "No Windows EXE was built."
          }

          Write-Host "Starting $($exe.FullName)"
          $process = Start-Process -FilePath $exe.FullName -PassThru
          $ok = $false

          try {
            for ($i = 1; $i -le 60; $i++) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:17876/health" -TimeoutSec 2
                if ($health.ok -eq $true -and $health.app -eq "azhen-desktop-pet" -and $null -ne $health.settings.hideOnFullScreen) {
                  $health | ConvertTo-Json -Depth 6
                  $ok = $true
                  break
                }
              } catch {
                Write-Host "Waiting for desktop pet health endpoint..."
              }
            }
          } finally {
            Get-CimInstance Win32_Process |
              Where-Object { $_.CommandLine -like "*Azhen Desktop Pet*" -or $_.CommandLine -like "*azhen-desktop-pet*" } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

          if (-not $ok) {
            throw "Windows EXE did not start or did not expose a healthy desktop-pet endpoint."
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azhen-desktop-pet-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
