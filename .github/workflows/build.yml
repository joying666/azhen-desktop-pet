name: Build Desktop Pet

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1

      - name: Syntax check
        run: npm run check

      - name: Build Windows artifacts
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm run dist:win
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1

      - name: Smoke test Windows EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "No Windows EXE was built."
          }

          function Get-PetHealth {
            return Invoke-RestMethod -Uri "http://127.0.0.1:17876/health" -TimeoutSec 2
          }

          function Wait-PetHealth {
            param(
              [scriptblock]$Predicate,
              [string]$Description,
              [int]$Attempts = 60,
              [int]$DelayMs = 1000
            )

            $lastHealth = $null
            for ($i = 1; $i -le $Attempts; $i++) {
              Start-Sleep -Milliseconds $DelayMs
              try {
                $lastHealth = Get-PetHealth
                if (& $Predicate $lastHealth) {
                  $lastHealth | ConvertTo-Json -Depth 6
                  return $lastHealth
                }
              } catch {
                Write-Host "Waiting for desktop pet health endpoint..."
              }
            }

            if ($lastHealth) {
              $lastHealth | ConvertTo-Json -Depth 6
            }
            throw "Timed out waiting for $Description."
          }

          Write-Host "Starting $($exe.FullName)"
          $process = Start-Process -FilePath $exe.FullName -PassThru
          $ok = $false

          try {
            Wait-PetHealth -Description "main health endpoint" -Predicate {
              param($health)
              $health.ok -eq $true -and
                $health.app -eq "azhen-desktop-pet" -and
                $null -ne $health.settings.hideOnFullScreen
            } | Out-Null

            Wait-PetHealth -Description "renderer default working state" -Attempts 90 -Predicate {
              param($health)
              $health.state -eq "working" -and
                $health.loop -eq $true
            } | Out-Null

            $stateCases = @(
              @{ Event = "agent.task.running"; State = "working" },
              @{ Event = "agent.task.done"; State = "done" },
              @{ Event = "agent.task.failed"; State = "failed" },
              @{ Event = "agent.waiting.user"; State = "paused" },
              @{ Event = "reminder.water.hourly"; State = "water" }
            )

            foreach ($stateCase in $stateCases) {
              $eventName = [System.Uri]::EscapeDataString($stateCase.Event)
              $eventResult = Invoke-RestMethod -Uri "http://127.0.0.1:17876/event?name=$eventName&manual=1" -TimeoutSec 2
              if ($eventResult.ok -ne $true) {
                throw "Manual event $($stateCase.Event) was rejected."
              }

              Wait-PetHealth -Description "manual state $($stateCase.State) loop lock" -Attempts 30 -DelayMs 500 -Predicate {
                param($health)
                $health.state -eq $stateCase.State -and
                  $health.loop -eq $true -and
                  $health.manualStateLock -eq $stateCase.State
              } | Out-Null
            }

            $ok = $true
          } finally {
            Get-Process -Name "Azhen Desktop Pet" -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

          if (-not $ok) {
            Get-CimInstance Win32_Process |
              Where-Object { $_.Name -like "*Azhen*" -or $_.ExecutablePath -like "*Azhen Desktop Pet*" } |
              Select-Object ProcessId, Name, ExecutablePath, CommandLine |
              Format-List
            throw "Windows EXE did not start or did not expose a healthy desktop-pet endpoint."
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azhen-desktop-pet-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
